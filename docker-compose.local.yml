# Local: app + Traefik on the same host (external `traefik` network).
# Requires: docker network create traefik && your Traefik container attached to it.
#   docker compose -f docker-compose.local.yml up --build
#
# Site / API: http://sparkco.localhost (Traefik). Backend is not published on host :4000.

services:
  frontend:
    init: true  
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:4000
    container_name: sparkco-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
      BACKEND_INTERNAL_URL: http://backend:4000

    ports:
      - "3000:3000"

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sparkco-web.rule=Host(`sparkco.localhost`)"
      - "traefik.http.routers.sparkco-web.entrypoints=web"
      - "traefik.http.services.sparkco-web.loadbalancer.server.port=3000"
    depends_on:
      - backend

  backend:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkco-backend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 4000

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sparkco-api.rule=Host(`sparkco.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sparkco-api.entrypoints=web"
      - "traefik.http.routers.sparkco-api.priority=100"
      - "traefik.http.services.sparkco-api.loadbalancer.server.port=4000"

networks:
  traefik:
    external: true